{% extends 'base.html' %}
{% block title %}Connexion — Contrôle DSF{% endblock %}
{% block content %}
<div class="login-layout">
  <section class="card panel-card login-card">
    <div class="card-body p-4 p-lg-5">
      <p class="eyebrow">ACCÈS SÉCURISÉ</p>
      <h1 class="h3 mb-2">Connexion</h1>
      <p class="text-secondary mb-4">Connectez-vous pour accéder aux DSF qui vous sont attribuées.</p>
      <form method="post" action="{{ url_for('auth.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <div class="mb-3">
          <label class="form-label fw-semibold" for="username">Nom d'utilisateur</label>
          <input id="username" name="username" class="form-control form-control-lg" required autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
          <div class="form-text">Le nom d'utilisateur est écrit uniquement en minuscules.</div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold" for="password">Mot de passe</label>
          <div class="input-group input-group-lg"><input id="password" name="password" type="password" class="form-control" required autocomplete="current-password"><button id="toggleLoginPassword" class="btn btn-outline-secondary" type="button" aria-pressed="false">Afficher</button></div>
        </div>
        <button class="btn btn-primary btn-lg w-100" type="submit">Se connecter</button>
      </form>
    </div>
  </section>
</div>
{% endblock %}
